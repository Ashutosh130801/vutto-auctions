# ---------------------------------------------------------------------------
# CI — runs on every push and pull request.
#
# Mirrors `make check` (lint → test → web-lint) plus a frontend build check.
# Tests run against a real PostgreSQL service container — never SQLite — because
# correctness depends on row locking, SKIP LOCKED and NUMERIC semantics.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  # ── Backend: lint ────────────────────────────────────────────────────────
  backend-lint:
    name: "Backend · Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: pip-lint-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Mypy
        run: mypy app

  # ── Backend: test ────────────────────────────────────────────────────────
  backend-test:
    name: "Backend · Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vutto
          POSTGRES_PASSWORD: vutto
          POSTGRES_DB: vutto_test
        options: >-
          --health-cmd "pg_isready -U vutto -d vutto_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
        ports:
          - 5432:5432
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vutto:vutto@localhost:5432/vutto_test
      APP_ENV: test
      SECRET_KEY: ci-test-secret-not-for-production-0123456789abcdef
      LOG_LEVEL: WARNING
      METRICS_ENABLED: "true"
      RUN_BACKGROUND_WORKERS: "false"
      RATE_LIMIT_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-test-${{ hashFiles('backend/requirements-dev.txt') }}
          restore-keys: pip-test-

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: >
          pytest
          --cov=app
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  # ── Frontend: lint & build ───────────────────────────────────────────────
  frontend:
    name: "Frontend · Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript type-check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

  # ── Docker: build smoke test ─────────────────────────────────────────────
  docker-build:
    name: "Docker · Build"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { context: backend, tag: vutto-api }
          - { context: frontend, tag: vutto-web }
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.target.tag }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.target.context }}
          push: false
          tags: ${{ matrix.target.tag }}:ci
