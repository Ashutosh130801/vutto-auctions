name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    services:
      # Tests run against a real PostgreSQL. SQLite would not reproduce
      # SELECT FOR UPDATE, SKIP LOCKED or partial unique indexes, which is
      # precisely what this suite exists to verify.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vutto
          POSTGRES_PASSWORD: vutto
          POSTGRES_DB: vutto_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vutto"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://vutto:vutto@localhost:5432/vutto_test
      DATABASE_URL: postgresql+asyncpg://vutto:vutto@localhost:5432/vutto_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-0123456789abcdef0123456789abcdef

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Type check
        working-directory: backend
        run: mypy app

      - name: Migrations apply cleanly from scratch
        working-directory: backend
        run: |
          python -m app.cli migrate
          python -m app.cli downgrade base
          python -m app.cli migrate

      - name: Tests (including concurrency storms)
        working-directory: backend
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend — types, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json

      - working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  images:
    name: Container images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ./backend, push: false, tags: vutto/api:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ./frontend, push: false, tags: vutto/web:ci, cache-from: type=gha, cache-to: "type=gha,mode=max" }

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    needs: [images]
    steps:
      - uses: actions/checkout@v4
      - name: Bring the stack up and exercise it
        run: |
          docker compose up -d --build
          # Wait for readiness rather than sleeping a fixed amount.
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready | tee /dev/stderr | grep -q '"status":"ready"'
          curl -fsS "http://localhost:8000/api/v1/auctions?status=LIVE" | grep -q '"items"'
          curl -fsS http://localhost:8080/ | grep -q "<div id=\"root\">"
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - if: always()
        run: docker compose down -v
