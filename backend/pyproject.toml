[project]
name = "vutto-auctions-api"
version = "1.0.0"
description = "Production-grade live auction platform for used motorcycles"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "redis==5.2.1",
  "argon2-cffi==23.1.0",
  "pyjwt==2.10.1",
  "structlog==24.4.0",
  "python-multipart==0.0.20",
  "email-validator==2.2.0",
  "prometheus-client==0.21.1",
  "orjson==3.10.13",
  "httpx==0.28.1",
]

[project.optional-dependencies]
otel = [
  "opentelemetry-sdk==1.29.0",
  "opentelemetry-instrumentation-fastapi==0.50b0",
  "opentelemetry-instrumentation-sqlalchemy==0.50b0",
  "opentelemetry-instrumentation-redis==0.50b0",
  "opentelemetry-exporter-otlp-proto-grpc==1.29.0",
]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.0",
  "pytest-cov==6.0.0",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "fakeredis==2.26.2",
  "pgserver==0.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately use literal credentials, `Decimal as D` for readability,
# and seeded PRNGs; none of those are defects in a test.
"tests/*" = ["S105", "S106", "S107", "S108", "S311", "N817"]
"app/seed.py" = ["S311"]          # demo data, not cryptography
"migrations/*" = ["E501", "I001"]  # generated by Alembic

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running tests (concurrency storms)"]

[tool.mypy]
python_version = "3.10"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false
