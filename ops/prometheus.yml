global:
  scrape_interval: 10s
  evaluation_interval: 15s
  external_labels: { service: vutto-auctions }

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: vutto-api
    metrics_path: /metrics
    # DNS service discovery resolves every replica behind the compose service
    # name, so `make scale` is picked up without editing this file.
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
